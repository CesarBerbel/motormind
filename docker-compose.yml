services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oficina_admin
      POSTGRES_USER: oficina_admin
      POSTGRES_PASSWORD: oficina_admin_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_admin -d oficina_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - ./backend/.env.example
    environment:
      DEBUG: "False"
      SECRET_KEY: "dev-docker-oficina-admin-2026-chave-local-forte-altere-em-producao"
      DATABASE_URL: "postgres://oficina_admin:oficina_admin_dev@postgres:5432/oficina_admin"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080"
      FRONTEND_BASE_URL: "http://localhost:8080"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build: ./backend
    command: celery -A config worker -l INFO
    env_file:
      - ./backend/.env.example
    environment:
      DEBUG: "False"
      SECRET_KEY: "dev-docker-oficina-admin-2026-chave-local-forte-altere-em-producao"
      DATABASE_URL: "postgres://oficina_admin:oficina_admin_dev@postgres:5432/oficina_admin"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      - backend
      - redis

  beat:
    build: ./backend
    command: celery -A config beat -l INFO
    env_file:
      - ./backend/.env.example
    environment:
      DEBUG: "False"
      SECRET_KEY: "dev-docker-oficina-admin-2026-chave-local-forte-altere-em-producao"
      DATABASE_URL: "postgres://oficina_admin:oficina_admin_dev@postgres:5432/oficina_admin"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  media_data:
